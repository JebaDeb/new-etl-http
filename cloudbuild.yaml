steps:
  - name: 'python:3.11'
    entrypoint: 'bash'
    args: ['-c', 'pip install -r requirements.txt && pytest']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/etl-service:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/etl-service:$SHORT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - etl-service
      - --image
      - gcr.io/$PROJECT_ID/etl-service:$SHORT_SHA
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --tag
      - staging

substitutions:
  _SERVICE_NAME: etl-service
  _REGION: us-central1

images:
  - gcr.io/$PROJECT_ID/etl-service:$SHORT_SHA
